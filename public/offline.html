<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mất Kết Nối - AVsub PRO</title>
  <meta name="description" content="Trang ngoại tuyến của AVsub PRO. Vui lòng kiểm tra lại kết nối Wifi hoặc mạng di động (4G/5G) trên thiết bị của bạn.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mất Kết Nối - AVsub PRO">
  <meta property="og:description" content="Trang ngoại tuyến của AVsub PRO. Vui lòng kiểm tra lại kết nối Wifi hoặc mạng di động (4G/5G) trên thiết bị của bạn.">
  <meta property="og:image" content="/icon-512.png">
  <!-- Outfit and Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #050406;
      --accent-color: #ff3b30;
      --accent-glow: rgba(255, 59, 48, 0.45);
      --glass-bg: rgba(15, 14, 20, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Ambient neon background glow */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      filter: blur(50px);
    }

    .offline-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 24rem;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Branded glowing header icon */
    .offline-icon-wrapper {
      width: 5rem;
      height: 5rem;
      background: rgba(255, 59, 48, 0.1);
      border: 1px solid rgba(255, 59, 48, 0.25);
      border-radius: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem auto;
      box-shadow: 0 0 20px rgba(255, 59, 48, 0.15);
      position: relative;
    }

    .offline-icon-wrapper i {
      font-size: 2.25rem;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
      animation: heartbeat 2s infinite alternate;
    }

    /* Small pulsing status indicator */
    .status-dot {
      position: absolute;
      top: -0.25rem;
      right: -0.25rem;
      width: 0.75rem;
      height: 0.75rem;
      background-color: var(--accent-color);
      border-radius: 50%;
      border: 2px solid var(--bg-color);
      animation: pulse 1.5s infinite;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .brand-highlight {
      color: var(--accent-color);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    p.error-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2.5rem;
      padding: 0 0.5rem;
    }

    /* Premium interactive retry button */
    .retry-btn {
      width: 100%;
      height: 3rem;
      background: linear-gradient(135deg, var(--accent-color), #ff6b62);
      border: none;
      border-radius: 1rem;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 10px 20px rgba(255, 59, 48, 0.2);
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(255, 59, 48, 0.35);
    }

    .retry-btn:active {
      transform: scale(0.96);
    }

    /* Auto-reconnect banner */
    .reconnect-footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .reconnect-spinner {
      width: 0.75rem;
      height: 0.75rem;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--text-main);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* Animations */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heartbeat {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.08);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(255, 59, 48, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="offline-container">
    <!-- Pulsing Header Icon -->
    <div class="offline-icon-wrapper">
      <i class="fa-solid fa-wifi"></i>
      <div class="status-dot"></div>
    </div>

    <!-- Title and Brand -->
    <h1>MẤT KẾT NỐI MẠNG</h1>
    <div class="brand-title">AVsub<span class="brand-highlight">PRO</span></div>

    <!-- Descriptions -->
    <p class="error-desc">
      Không thể kết nối với máy chủ. Vui lòng kiểm tra lại kết nối Wifi hoặc mạng di động (4G/5G) trên thiết bị của bạn.
    </p>

    <!-- Interactive Retry Button -->
    <button class="retry-btn" onclick="handleRetry()">
      <i class="fa-solid fa-arrows-rotate"></i>
      <span>Thử lại ngay</span>
    </button>

    <!-- Reconnect status spinner -->
    <div class="reconnect-footer">
      <div class="reconnect-spinner"></div>
      <span>Đang tự động theo dõi kết nối...</span>
    </div>
  </div>

  <script>
    // 1. Auto reload when network connectivity is restored
    window.addEventListener('online', () => {
      triggerVibrate();
      window.location.reload();
    });

    // 2. Retry click handler
    function handleRetry() {
      triggerVibrate();
      
      // Add subtle rotation animation on the icon
      const icon = document.querySelector('.retry-btn i');
      if (icon) {
        icon.style.transition = 'transform 0.5s ease';
        icon.style.transform = 'rotate(360deg)';
      }
      
      setTimeout(() => {
        window.location.reload();
      }, 300);
    }

    // 3. Physical haptic feedback on mobile if supported
    function triggerVibrate() {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(30); // 30ms short tap
      }
    }
  </script>
</body>
</html>
