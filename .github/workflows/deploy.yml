name: Build and Deploy AVsub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.prep.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Tag
        id: prep
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            TAG="dev"
          else
            TAG="latest"
          fi
          IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}:$TAG" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: minipc
    environment:
      name: ${{ github.ref_name == 'develop' && 'dev' || 'prod' }}
    steps:
      - name: Deploy to Mini PC
        run: |
          cd ${{ secrets.DEPLOY_PATH || '~/Project/AVsub' }}
          AVSUB_IMAGE=${{ needs.build.outputs.image_tag }} docker compose pull avsub
          AVSUB_IMAGE=${{ needs.build.outputs.image_tag }} docker compose up -d avsub
