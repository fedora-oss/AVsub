version: '3.8'

services:
  # 🔍 AVsub - Subtitle Search & Automation Engine (Vue/Nuxt 4)
  avsub:
    image: ${AVSUB_IMAGE:-ghcr.io/username/avsub:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avsub
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount thư mục chứa phim JAV chính (AVsub container thấy tại /movies/uncen)
      - ${MOVIE_DIRECTORY_REAL}:/movies/uncen
      # Mount thư mục đồng bộ tạm thời (AVsub container thấy tại /movies/sync)
      - ${MOVIE_DIRECTORY_SYNC}:/movies/sync
      # Mount dữ liệu cá nhân của AVsub (SQLite avsub.db)
      - ${AVSUB_DATA_PATH}:/data
      # Mount CSDL Javinizer dạng chỉ đọc (Read-only) để truy vấn nhanh actress/movies metadata
      - ${JAVINIZER_DATA_PATH}/javinizer.db:/data/javinizer.db:ro
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - MOVIE_DIRECTORY=/movies
      - JAVINIZER_URL=${JAVINIZER_URL:-http://javinizer:9999}
      - JAVINIZER_TOKEN=${JAVINIZER_TOKEN}
      - JAVINIZER_MOVIE_DIR=${JAVINIZER_MOVIE_DIR:-/media/uncen}
      - WATCHER_POLLING=${WATCHER_POLLING:-true}
      - WATCHER_POLL_INTERVAL=${WATCHER_POLL_INTERVAL:-5000}
      - WATCHER_STABILITY_THRESHOLD=${WATCHER_STABILITY_THRESHOLD:-10000}
    depends_on:
      javinizer:
        condition: service_healthy
    networks:
      - avsub-network

  # 🎭 Javinizer - JAV Metadata Scraper & File Organizer Engine
  javinizer:
    image: ghcr.io/javinizer/javinizer-go:latest
    container_name: javinizer
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      # Thư mục cấu hình, logs và CSDL SQLite (javinizer.db)
      - ${JAVINIZER_DATA_PATH}:/javinizer
      # Thư mục phim JAV chính (Javinizer thấy tại /media/uncen)
      - ${MOVIE_DIRECTORY_REAL}:/media/uncen
      # Thư mục đồng bộ tạm thời (Javinizer thấy tại /media/sync)
      - ${MOVIE_DIRECTORY_SYNC}:/media/sync
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - JAVINIZER_TEMP_DIR=/javinizer/temp
      - JAVINIZER_ALLOW_LOCAL_PROXY=true
      - JAVINIZER_ALLOW_PRIVATE_IPS=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - avsub-network

  # 🧲 qBittorrent - High-performance Torrent Downloader
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080" # WebUI Port
      - "6881:6881" # Torrent Traffic Port
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - WEBUI_PORT=8080
    volumes:
      # Lưu cấu hình và CSDL torrents
      - ./qbit-config:/config
      # Tải trực tiếp torrents về thư mục đồng bộ tạm thời của hệ thống
      - ${MOVIE_DIRECTORY_SYNC}:/downloads
    networks:
      - avsub-network

networks:
  avsub-network:
    driver: bridge
